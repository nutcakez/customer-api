server:
  port: 8080

spring:
  application:
    name: customer-api
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:h2:mem:customers;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/customer-realm}

customer-api:
  # seed-file: set in application-demo.yml, no seeding without it
  demo-ui:
    enabled: false
